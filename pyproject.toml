[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "Global futures research and paper-trading simulation lab"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Harish Saini" }]

[tool.setuptools.packages.find]
include = ["marketlens*"]
